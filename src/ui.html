<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: Inter, sans-serif; padding: 12px; margin: 0; }
    button { display: block; width: 100%; margin-bottom: 8px; padding: 8px; font-size: 13px; cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>
  <button id="btn-new-palette">New Palette</button>
  <button id="btn-new-color" disabled>New Color</button>
  <button id="btn-update-all" disabled>Update All</button>
</body>
</html>
